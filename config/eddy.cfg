# eddy.cfg -- config ativa do BTT Eddy Duo nesta N4Max (fork S&M Makers, base 0.13.0)
# usar z_offset, NAO descend_z (rename so existe em Klipper pos-2026-03-18, mais novo que este fork)
#
# DECISAO DO IGOR 2026-08-28: altura de montagem 0,94mm (bico encostando na mesa -> face do coil
# a 0,94mm da mesa). Abaixo do recomendado pelo manual BTT (2-3mm), risco mecanico assumido
# conscientemente. Mitigacoes de config abaixo compensam a folga menor:
# - bed_mesh mantido SEM METHOD=scan (usar so `BED_MESH_CALIBRATE` simples): cada ponto sobe pra
#   horizontal_move_z (10mm) antes de mover em XY, dando folga cheia entre leituras. O modo
#   METHOD=scan/rapid_scan faz varredura CONTINUA rente a mesa (a real vantagem de velocidade do
#   Eddy) -- com 0,94mm de folga isso e risco de verdade (bump/resíduo/verruga na mesa durante o
#   passe).
#   REAVALIADO 2026-08-29 -- DECISAO DO IGOR: USAR rapid_scan. A restricao acima nasceu de
#   medo do mount de 0,94mm, mas quem define a folga do bico no passe e o HORIZONTAL_MOVE_Z
#   (2.5mm), nao a altura de montagem da bobina. Com 2.5mm o bico tem folga normal e a bobina
#   fica a 3.44mm, dentro da faixa calibrada de 4.05mm. rapid_scan e a razao de existir do Eddy.
# - mesh_min/mesh_max mantidos com boa margem das bordas (ja eram 20,30 / 395,400 num prato de
#   430x430, ~20-30mm de recuo -- mantido, some com o offset do sensor quando ele for medido).
# - horizontal_move_z: 10 (igual ao [bed_mesh] antigo) -- folga de sobra entre pontos.
# - safe_z_home z_hop: 10 (ja existia) -- mantido, cobre o homing.

[mcu eddy]
serial: /dev/serial/by-id/usb-Klipper_rp2040_SEU_SERIAL_AQUI-if00  # troque pelo SEU: ls /dev/serial/by-id/
# confirmado 2026-08-28 (rodada 6): mcu conecta, protocolo identico ao host (mesma tag de build)

[probe_eddy_ng btt_eddy]
sensor_type: ldc1612
i2c_mcu: eddy
i2c_bus: i2c0f
x_offset: -33.34
y_offset: 20
# CONFIRMADO 2026-08-28. Medida real: 32.33mm do centro do bico ao centro do parafuso/corpo do
# Eddy (paquimetro, coil e concentrica com o furo de fixacao -- nao precisa abrir a carcaca).
# SINAL corrigido depois de checar [stepper_x] no printer.cfg real: position_endstop=0,
# homing_positive_dir=false -> fim de curso X fica no lado X=0 (esquerda). Igor confirmou o Eddy
# fica do lado do fim de curso -> sensor esta a ESQUERDA do bico, nao a direita como foi dito
# antes. x_offset NEGATIVO. Isso bate com TODOS os relatos da comunidade (-18 a -41mm, todos
# negativos) -- convergencia forte, tratada como confirmacao do sinal.
# y_offset MEDIDO 2026-08-29: Igor mediu 20mm. Sensor fica ATRAS e a esquerda do bico -> o ponto
# do prato sob a bobina tem Y maior que o do bico -> y_offset POSITIVO. x_offset remedido no mesmo
# dia: 33.34 (antes estava 32.33, digito trocado). ATENCAO: a [bed_mesh default] gravada no
# printer.cfg foi sondada com y_offset=0 -> esta 20mm fora do lugar, REFAZER.
# z_offset REMOVIDO DAQUI 2026-08-29. Enquanto ele estava escrito neste arquivo incluido,
# todo SAVE_CONFIG apos um PROBE_CALIBRATE falhava com "conflicts with included value":
# o Klipper nao sobrescreve por autosave um valor que veio de um include. Agora quem manda
# e o bloco autosave no fim do printer.cfg, entao o PROBE_CALIBRATE grava normalmente.
# Para ver o valor vigente: ZOFFSET. Para ajustar imprimindo: SOBE / DESCE / ZOFFSET_SALVAR.
# (era "z_offset: 1.95")
# aproximacao inicial so pra rodar a calibracao -- PROBE_EDDY_CURRENT_CALIBRATE ajusta a curva real
#speed: 5.0
#samples: 2
#samples_result: median
#sample_retract_dist: 1.0
# calibrate: (nao setar antes de calibrar -- neste fork 'calibrate' NAO e path de arquivo, e a
# string inline de pares freq:z que o PROBE_EDDY_CURRENT_CALIBRATE grava sozinho via SAVE_CONFIG.
# Botar um path aqui quebra o boot: 'could not convert string to float' -- ja aconteceu uma vez.)

# [temperature_probe btt_eddy] -- REMOVIDO POR ORA 2026-08-28. Este fork nao tem sensor_factory
# dedicada pro chip do Eddy (grep em klippy/extras/*.py -- so existe thermistor/temperature_mcu/etc,
# nenhuma p/ ldc1612). O objeto exige 'sensor_type:' obrigatorio (herda de PrinterHeaterGeneric via
# heaters.setup_sensor) e sem isso o Klipper nao sobe. NAO e essencial p/ sondar -- e so compensacao
# de drift termico opcional. Investigar depois: 'sensor_type: temperature_mcu' + 'sensor_mcu: eddy'
# (usa a temperatura interna do proprio RP2040 do Eddy como proxy) e o candidato mais plausivel,
# mas NAO testado ainda -- nao adicionar sem confirmar que nao quebra o boot de novo.

[bed_mesh]
speed: 200
horizontal_move_z: 2.5
mesh_min: 20,25   # 2026-08-29: limite real, nao estetico. Em X o bico vai para ponto+33.34,
                  # entao X20 leva o bico a 53.34. Em Y o bico vai para ponto-20, entao Y25
                  # leva o bico a 5, quase no batente da frente. X abaixo de 20 faria a
                  # bobina passar por cima da borracha de limpeza (X0-5, 7mm de altura).
mesh_max: 390,410  # maximo alcancavel: bico em 390+33.34=423.34 contra position_max 430.1,
                   # e em Y 410-20=390. Medir alem disso exigiria o bico fora do curso.
# RECALCULADO 2026-08-28 com x_offset=-32.33 (sensor a ESQUERDA do bico). Formula do Klipper:
# posicao do bico ao sondar um ponto do mesh = ponto_mesh - offset. Com offset negativo, o bico
# tem que ir MAIS PRA DIREITA que o ponto sondado (bico = ponto + 32.33) -- entao o lado que
# encolhe e o mesh_max (direita), nao o mesh_min. Old mesh_max 395 -> bico precisaria ir a
# 395+32.33=427.33, quase no limite fisico (position_max 430.1 do [stepper_x], sem margem de
# seguranca). Novo mesh_max 360 -> bico vai a 360+32.33=392.33, dentro do range antigo com folga.
# mesh_min 20 mantido sem mudanca (bico so precisaria ir a 20+32.33=52.33, longe do limite fisico
# 0/-0.1, sobra folga -- o lado esquerdo nao e o gargalo aqui).
# y_offset assumido 0 -> mesh_min/mesh_max em Y nao mudam.
probe_count: 6,6
algorithm: bicubic
bicubic_tension: 0.2
mesh_pps: 2, 2
fade_start: 5.0
fade_end: 30.0

# Reference mesh: 2500 real Eddy readings on a heat-stabilized bed.
# Use: EDDY_MALHA [BED=50] [SOAK=300]
# When complete, run SAVE_CONFIG to persist the default profile.
[gcode_macro EDDY_MALHA]
description: Malha densa de toda a area util. Ex: EDDY_MALHA BED=50 SOAK=300
# Aquece a mesa, espera estabilizar, faz o soak, homeia e varre em movimento continuo.
# 70x70 = 4900 pontos em 370x385mm, cerca de 5,3mm de espacamento.
# A varredura em si e rapida; o tempo aqui e quase todo soak, que e o que faz a malha
# valer alguma coisa (mesa fria mede uma coisa, mesa estabilizada mede outra).
variable_pontos: 70
gcode:
[gcode_macro EDDY_MALHA]
description: Malha Eddy segura - Neptune 4 Max
variable_pontos: 70

gcode:
   [gcode_macro EDDY_MALHA]
description: Malha Eddy segura - Neptune 4 Max
variable_pontos: 70

gcode:
   [gcode_macro EDDY_MALHA]
description: Malha Eddy segura - Neptune 4 Max
variable_pontos: 70

gcode:
    {% set c = printer['gcode_macro EDDY_MALHA'] %}
    {% set bed = params.BED|default(50)|float %}
    {% set soak = params.SOAK|default(60)|int %}
    {% set n = params.PONTOS|default(c.pontos)|int %}

    # Pega os limites atuais configurados no [bed_mesh]
    {% set mesh_min = printer.configfile.settings.bed_mesh.mesh_min %}
    {% set mesh_max = printer.configfile.settings.bed_mesh.mesh_max %}

    # Mantem X original
    {% set min_x = mesh_min[0] %}
    {% set max_x = mesh_max[0] %}

    # =====================================================
    # PROTECAO DA BORRACHA
    #
    # Borracha:
    # X = 0 ate 5
    # Y = 0 ate 35
    # Z = ate aproximadamente 7mm
    #
    # A malha nunca comeca antes de Y40
    # =====================================================

    {% if mesh_min[1] < 40 %}
        {% set min_y = 40 %}
    {% else %}
        {% set min_y = mesh_min[1] %}
    {% endif %}

    # =====================================================
    # FINAL DO Y
    #
    # Retira 5mm do limite atual para nao sair da mesa
    # =====================================================

    {% set max_y = mesh_max[1] - 5 %}


    # =====================================================
    # VALIDACOES
    # =====================================================

    {% if printer.print_stats.state in ['printing', 'paused'] %}
        { action_raise_error("EDDY_MALHA: impressora ocupada") }
    {% endif %}

    {% if bed < 0 or bed > 100 %}
        { action_raise_error("EDDY_MALHA: BED deve estar entre 0 e 100C") }
    {% endif %}

    {% if soak < 0 or soak > 3600 %}
        { action_raise_error("EDDY_MALHA: SOAK deve estar entre 0 e 3600s") }
    {% endif %}

    {% if n < 4 or n > 100 %}
        { action_raise_error("EDDY_MALHA: PONTOS deve estar entre 4 e 100") }
    {% endif %}


    # =====================================================
    # AQUECE A MESA E AGUARDA
    # =====================================================

    M117 Aquecendo mesa
    M190 S{bed}

    RESPOND TYPE=command MSG="Mesa em {bed}C. Iniciando soak de {soak}s."


    # =====================================================
    # SOAK
    # =====================================================

    M117 Soak
    G4 P{soak * 1000}


    # =====================================================
    # HOME
    # =====================================================

    M117 Homeando
    G28


    # =====================================================
    # SOBE PARA PASSAR COM SEGURANCA
    #
    # Borracha chega ate Z7
    # Primeiro subimos para Z10
    # =====================================================

    G90
    G1 Z10 F600


    # =====================================================
    # LIMPA MALHA ANTERIOR
    # =====================================================

    BED_MESH_CLEAR


    # =====================================================
    # MOSTRA AREA QUE SERA ESCANEADA
    # =====================================================

    RESPOND TYPE=command MSG="EDDY: X {min_x} ate {max_x} / Y {min_y} ate {max_y}"


    # =====================================================
    # RAPID SCAN
    # =====================================================

    M117 Varrendo mesa

    _BED_MESH_CALIBRATE METHOD=rapid_scan HORIZONTAL_MOVE_Z=2.5 MESH_MIN={min_x},{min_y} MESH_MAX={max_x},{max_y} PROBE_COUNT={n},{n} MESH_PPS=0 SCAN_SPEED=200


    # =====================================================
    # FINALIZACAO
    # =====================================================

    M400

    M117 Malha pronta

    RESPOND TYPE=command MSG="Malha {n}x{n} pronta. Inicio Y={min_y}, final Y={max_y}. Rode SAVE_CONFIG."

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: _BED_MESH_CALIBRATE
description: Chama a EDDY_MALHA (malha densa por varredura)
gcode:
    EDDY_MALHA {rawparams}
