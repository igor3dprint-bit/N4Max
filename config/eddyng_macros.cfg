# ===========================================================================
# eddyng_macros.cfg -- fluxo novo pos-eddy-ng (2026-09-03)
# Incluido por ULTIMO no printer.cfg: o que estiver aqui SOBRESCREVE o que
# tem o mesmo nome la em cima (Klipper fica com a ultima definicao).
#
# Contexto: a borracha de limpeza foi REMOVIDA da maquina. Tudo que dependia
# dela (LIMPAR_BICO, PURGA_BAMBU, LINHA_PURGA, EDDY_OFFSET_FULL) esta obsoleto
# e nao e mais chamado por nada daqui.
# ===========================================================================


# ---------------------------------------------------------------------------
# LINHA_KAMP -- linha de purga na frente da mesa, estilo KAMP.
# Sem limpeza, sem borracha. Bico ja na temperatura final quando roda.
# ---------------------------------------------------------------------------
[gcode_macro LINHA_KAMP]
description: Linha de purga na frente da mesa (estilo KAMP)
variable_x_ini: 25
variable_x_fim: 390
variable_y: 5
variable_z: 0.3
variable_e: 50.4
variable_veloc: 1200
gcode:
    {% set c = printer['gcode_macro LINHA_KAMP'] %}
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        { action_raise_error("LINHA_KAMP: eixos nao homeados") }
    {% endif %}
    {% if printer.extruder.temperature < 170 %}
        { action_raise_error("LINHA_KAMP: bico frio demais para extrudar") }
    {% endif %}
    M117 Linha de purga
    G90
    G0 Z5 F1200
    G0 X{c.x_ini} Y{c.y} F9000
    G0 Z{c.z} F600
    G92 E0
    M83
    G1 X{c.x_fim} E{c.e} F{c.veloc}
    G1 E-0.4 F2100
    G0 Z2 F600
    G0 X{c.x_fim + 25} F9000
    M82
    G92 E0
    M117


# ---------------------------------------------------------------------------
# PRINT_START -- fluxo enxuto pedido pelo Igor em 2026-09-03.
#   mesa aquece -> bico a 120C -> G28 -> bico na temperatura final ->
#   linha KAMP na frente -> imprime.
# Nenhuma limpeza, nenhum G28 depois da linha.
#
# MALHA DA MESA: deliberadamente FORA. A [bed_mesh default] gravada e invalida
# (foi sondada com y_offset=0, esta 20mm deslocada) e ainda e do driver antigo.
# Depois de calibrar o eddy-ng, descomente a linha BED_MESH_CALIBRATE abaixo
# para varrer a mesa a cada impressao (~20s com rapid_scan).
# ---------------------------------------------------------------------------
[gcode_macro PRINT_START]
description: Inicio de impressao -- G28 a 120C + linha KAMP na frente
variable_temp_home: 120
gcode:
    {% set c    = printer['gcode_macro PRINT_START'] %}
    {% set bed  = params.BED|default(printer.heater_bed.target)|float %}
    {% set extr = params.EXTRUDER|default(printer.extruder.target)|float %}
    {% set th   = c.temp_home|float %}

    G90
    G92 E0
    CLEAR_PAUSE

    M117 Aquecendo
    M140 S{bed}
    M104 S{th}
    M190 S{bed}
    M109 S{th}

    M117 Homeando a {th}C
    G28

    # Z-offset automatico: o tap encosta o bico na mesa e acha o zero real.
    # Feito a {th}C de proposito -- quente o bastante para a leitura ser
    # consistente, frio o bastante para o bico nao escorrer e sujar a medida.
    M117 Tap -- achando o zero
    PROBE_EDDY_NG_TAP

    #BED_MESH_CALIBRATE
    #BED_MESH_PROFILE LOAD=default

    M117 Temperatura final
    M109 S{extr}

    LINHA_KAMP

    M117 Printing


# ---------------------------------------------------------------------------
# ZoffNGEddy -- z-offset preciso pelo TAP do eddy-ng.
#   G28 -> sobe 50mm -> aquece 150C -> popup pedindo para tirar filamento e
#   limpar o bico -> voce clica OK -> faz o tap e grava.
#
# Se o popup nao aparecer (frontend antigo), rode ZOFFNG_OK na mao depois de
# limpar o bico: faz exatamente a mesma coisa.
# ---------------------------------------------------------------------------
[gcode_macro ZoffNGEddy]
description: Z-offset preciso via tap do eddy-ng (pede limpeza do bico)
variable_temp: 150
variable_altura: 50
gcode:
    {% set c = printer['gcode_macro ZoffNGEddy'] %}
    {% set t = params.TEMP|default(c.temp)|float %}
    {% if printer.print_stats.state in ['printing', 'paused'] %}
        { action_raise_error("ZoffNGEddy: impressora ocupada") }
    {% endif %}

    M117 Homeando
    G28
    G90
    G0 Z{c.altura} F1200

    M117 Aquecendo p/ limpeza
    M104 S{t}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={t - 2}

    RESPOND TYPE=command MSG="action:prompt_begin Z-offset do Eddy"
    RESPOND TYPE=command MSG="action:prompt_text Bico a {t}C e levantado 50mm. Tire o filamento e limpe bem a ponta do bico. Depois clique em OK para medir o z-offset."
    RESPOND TYPE=command MSG="action:prompt_footer_button OK|ZOFFNG_OK|primary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancelar|ZOFFNG_CANCELAR|error"
    RESPOND TYPE=command MSG="action:prompt_show"
    RESPOND TYPE=echo MSG="Se nao aparecer popup: limpe o bico e rode ZOFFNG_OK"


[gcode_macro ZOFFNG_OK]
description: Continua o ZoffNGEddy -- mede o z-offset pelo tap e grava
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        { action_raise_error("ZOFFNG_OK: eixos nao homeados -- rode ZoffNGEddy antes") }
    {% endif %}
    M117 Medindo z-offset (tap)
    PROBE_EDDY_NG_TAP
    # SEM SAVE_CONFIG aqui de proposito: SAVE_CONFIG reinicia o Klipper e
    # descartaria a medicao que acabou de ser feita. O tap nao e um numero
    # gravado -- ele e refeito a cada impressao dentro do PRINT_START.
    # Para gravar uma CORRECAO fixa em cima do tap (se ele ficar sempre alto
    # ou sempre baixo), use PROBE_EDDY_NG_SET_TAP_OFFSET e ai sim SAVE_CONFIG.
    M117 Zero medido


[gcode_macro ZOFFNG_CANCELAR]
description: Cancela o ZoffNGEddy e desliga o bico
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    M104 S0
    M117 Cancelado
