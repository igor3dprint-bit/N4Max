####################################################################################
# Machine type: NEPTUNE 4 MAX
# Current configuration version: V1.6
# Date：2024-6-24
####################################################################################
# This product (Neptune 4/4pro/4plus/4max) adopts Klipper firmware 
# and does not support users to update the official klipper/fluidd
# /moonraker by themselves, otherwise the machine will not work properly.
# If you want to DIY and are an expert or interested in this field, 
# we recommend that you prepare your own tools for burning images so 
# that you can restore them if problems arise. Please contact after-sales 
# support team for tutorials on burning images. Thank you for your cooperation!
####################################################################################
# This file contains common pin mappings for ZNP-K1-V2.0 
# boards. To use this config, the firmware should be compiled for the
# STM32F402. When running "make menuconfig", enable "extra low-level
# configuration setup", select the 32KiB bootloader, and serial (on
# USART1 PA10/PA9) communication.

# The "make flash" command does not work on the ZNP-K1-V2.0. Instead,
# after running "make", copy the generated "out/klipper.bin" file to a
# file named "elegoo_k1.bin" on an SD card and then restart the ZNP-K1-V2.0
# with that SD card.

# See docs/Config_Reference.md for a description of parameters.
####################################################################################



[include plr.cfg]
# DISABLED 2026-08-28: [include KAMP_Settings.cfg]
[include eddy.cfg]  # BTT Eddy Duo -- 2026-08-28, mcu/probe/temp/bed_mesh do Eddy

[mcu]
# The hardware use USART1 PA10/PA9 connect to RK3328
serial: /dev/ttyS0
restart_method: command

[stepper_x]
step_pin:PC14
dir_pin:PC13
enable_pin:!PC15
microsteps: 16
rotation_distance: 40
full_steps_per_rotation:200
endstop_pin:tmc2209_stepper_x:virtual_endstop
position_min: -0.1
position_endstop: 0
position_max: 430.1
homing_speed:50
homing_retract_dist:0
homing_positive_dir:false

[stepper_y]
step_pin:PB4
dir_pin:PB3
enable_pin:!PC15
microsteps:16
rotation_distance: 40
full_steps_per_rotation:200
endstop_pin:tmc2209_stepper_y:virtual_endstop
position_min: -0.1
position_endstop:0 
position_max:430.1
homing_speed:50
homing_retract_dist:0
homing_positive_dir:false

[stepper_z]
step_pin:PC10
dir_pin:!PA13
enable_pin: !PC11
microsteps: 16
rotation_distance: 8
full_steps_per_rotation: 200
endstop_pin:probe:z_virtual_endstop
# ATENCAO, leia antes de mexer nesta linha.
# Em 2026-08-29 foi tentado trocar por ^PA11, a sonda fisica original. NAO FUNCIONA
# NESTA MAQUINA porque o sensor foi REMOVIDO da cabeca na instalacao do Eddy. O cabo
# continua na placa e o pino flutua em nivel alto por causa do pull-up, o que faz o
# Klipper achar que ha um fim de curso acionado. Invertendo para ^!PA11 ele passa a ler
# solto SEMPRE, inclusive no contato, e o eixo desce ate o fim. Foi testado e o Igor
# precisou cortar a energia. So volte a considerar PA11 se um sensor de contato for
# fisicamente reinstalado, e valide antes com QUERY_ENDSTOPS apertando o bico com o dedo.
                          # REVALIDAR com papel antes de imprimir

##  Z-position of nozzle (in mm) to z-endstop trigger point relative to print surface (Z0)
##  (+) value = endstop above Z0, (-) value = endstop below
##	Increasing position_endstop brings nozzle closer to the bed
##  After you run Z_ENDSTOP_CALIBRATE, position_endstop will be stored at the very end of your config
#position_endstop:-5
position_max: 482.5
position_min: -5 
homing_speed: 8
homing_retract_dist: 1.5   # 2026-08-29: era 5 (heranca da sonda fisica). Com o Eddy, recuar 5mm apos o gatilho leva a bobina a ~7mm, fora da faixa de 4.05mm -> 2a passada cega -> Eddy current sensor error. 1.5 mantem a bobina em ~3.5mm.
second_homing_speed: 3

[extruder]
step_pin:PA5
dir_pin:!PA6
enable_pin:!PA4
microsteps:16
rotation_distance: 29.0  #31.4	#Bondtech 5mm Drive Gears
gear_ratio: 52:10
full_steps_per_rotation: 200	#200 for 1.8 degree, 400 for 0.9 degree
nozzle_diameter: 0.6
filament_diameter: 1.750
min_temp: 0
max_temp: 310
heater_pin: PA7
sensor_type:NTC 100K MGB18-104F39050L32
sensor_pin: PA1
max_power: 1
control : pid
pid_kp : 25.989
pid_ki : 3.397
pid_kd : 49.705
pressure_advance: 0.020
pressure_advance_smooth_time: 0.04
instantaneous_corner_velocity: 2.5
max_extrude_only_distance: 300
max_extrude_only_velocity:60
max_extrude_only_accel:5000
max_extrude_cross_section: 5   # bico 0.6 - protecao restaurada (era 9999999 do bico 1mm)
min_extrude_temp:100

[verify_heater extruder]
max_error: 120
check_gain_time:10
hysteresis: 10
heating_gain: 2

[heater_bed]
heater_pin:PB10
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PA0
max_power: 1.0
control : pid
pid_kp : 75.397
pid_ki : 0.823
pid_kd : 1727.531
pwm_cycle_time: 0.016
min_temp: 0
max_temp: 110

[verify_heater heater_bed]
max_error: 120
check_gain_time:300
hysteresis: 10
heating_gain: 2

[heater_fan fan1]
pin: PC7
shutdown_speed: 1

# fan for printed model FAN2
[fan]
pin: PB7

# [fan_generic fan3]
# pin: PC9

# [fan_generic fan4]
# pin: PA8

# [fan_generic fan5]
# pin: PA15


[printer]
kinematics:cartesian
max_velocity: 500
max_accel: 2000
#max_accel_to_decel: 20000
max_z_velocity: 10
max_z_accel: 100
square_corner_velocity: 5.0


[input_shaper]
#shaper_type_x = mzv
#shaper_freq_x = 62.2
#shaper_type_y = ei
#shaper_freq_y = 30.0
# damping_ratio_x: 0.1
# damping_ratio_y: 0.1


####################################################################
#	Homing and Gantry Adjustment Routines
#####################################################################
[idle_timeout]
timeout: 3600
gcode:
  {% if printer[printer.toolhead.extruder].temperature > 140 %}   # Reduce the hot end temperature after 10 minutes
  {action_respond_info("Extruder powered down on idle timeout.")}
  SET_HEATER_TEMPERATURE HEATER=extruder TARGET={120}       # After pausing printing, reduce nozzle temperature to 50℃
  M84 E
  # SET_IDLE_TIMEOUT TIMEOUT=259200       # Timer duration 3 days.
  {% else %}
  TURN_OFF_HEATERS
  M84 E
  {% endif %}

# Home automatico: sobe 7mm para liberar a borracha, homeia XY e deixa o
# proprio Eddy descer de qualquer altura ate encontrar a mesa.
[homing_override]
axes: xyz
gcode:
    {% set tudo = 'X' not in params and 'Y' not in params and 'Z' not in params %}
    {% set pede_z = tudo or 'Z' in params %}
    {% set eixos = printer.toolhead.homed_axes %}
    {% set z_homeado = 'z' in eixos %}
    {% if not z_homeado %}
        SET_KINEMATIC_POSITION Z=0 SET_HOMED=Z
        G91
        G0 Z7 F300
    {% elif printer.toolhead.position.z|float < 7 %}
        G90
        G0 Z7 F300
    {% endif %}
    G90

    {% if tudo or 'X' in params or (pede_z and 'x' not in eixos) %}
        G28 X
    {% endif %}
    {% if tudo or 'Y' in params or (pede_z and 'y' not in eixos) %}
        G28 Y
    {% endif %}

    {% if pede_z %}
        G0 X239.25 Y194.55 F6000
        SET_KINEMATIC_POSITION Z=482.5 SET_HOMED=Z
        G28 Z
    {% elif not z_homeado %}
        SET_KINEMATIC_POSITION CLEAR_HOMED=Z
    {% endif %}

[gcode_macro G29]
gcode:
      M400
      BED_MESH_CLEAR
      G28
      _BED_MESH_CALIBRATE profile=default mesh_min=20,30 mesh_max=360,400 probe_count=6 algorithm=bicubic
      M400
      G4 P2000
      G91 
      G1 Z5 F300 
      G90
      G28 Z
      G1 X215 Y215 F12000
      G1 Z0 F300

