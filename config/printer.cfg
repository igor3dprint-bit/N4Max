########################################
# PRINT_START/CANCEL_PRINT/PAUSE/RESUME/filament_switch_sensor
########################################

[print_stats]

[gcode_move]

    
# ---------------------------------------------------------------------------
# LIMPAR_BICO -- borracha de limpeza em X0-5 / Y0-35, altura 7mm (medida 2026-08-29)
# Passa o bico a 150C nela, 10 idas e voltas em Y. Ajuste os variable_ abaixo sem
# mexer no corpo da macro. z=6.0 => 1mm de interferencia na borracha de 7mm.
# ---------------------------------------------------------------------------
[gcode_macro LIMPAR_BICO]
description: Limpa o bico na borracha (10 passadas a 150C)
variable_x: 2.5
variable_y_ini: 5
variable_y_fim: 30
variable_z: 7.0
variable_passadas: 10
variable_temp: 150
gcode:
    {% set c = printer['gcode_macro LIMPAR_BICO'] %}
    {% set t = params.TEMP|default(c.temp)|float %}
    {% set n = params.PASSADAS|default(c.passadas)|int %}
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        { action_raise_error("LIMPAR_BICO: eixos nao homeados") }
    {% endif %}
    {% if t > 0 %}
        M117 Aquecendo p/ limpeza
        M109 S{t}
    {% endif %}
    M117 Limpando bico
    G90
    G0 Z{c.z + 6} F1200
    G0 X{c.x} Y{c.y_ini} F6000
    G0 Z{c.z} F600
    {% for i in range(n) %}
        G0 Y{c.y_fim} F6000
        G0 Y{c.y_ini} F6000
    {% endfor %}
    G0 Z{c.z + 10} F1200
    M117

# ---------------------------------------------------------------------------
# PRINT_START BED=<mesa> EXTRUDER=<bico>
# Ordem (pedido do Igor 2026-08-29): liga a mesa SEM esperar -> homeia -> limpa o bico
# a 150C com 10 passadas enquanto a mesa sobe -> so entao vai para a temperatura final.
# Sem KAMP (o include ja esta desativado na linha 31).
# Se BED/EXTRUDER nao forem passados, usa os alvos que o fatiador ja tiver setado.
# ---------------------------------------------------------------------------
[gcode_macro PRINT_START]
gcode:
    # guarda de z_offset do driver antigo removida na migracao p/ eddy-ng
    {% set bed  = params.BED|default(printer.heater_bed.target)|float %}
    {% set extr = params.EXTRUDER|default(printer.extruder.target)|float %}
    G92 E0
    G90
    CLEAR_PAUSE
    M140 S{bed}
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    SAVE_VARIABLE VARIABLE=was_interrupted VALUE=True
    LIMPAR_BICO
    M117 Temperatura final
    M104 S{extr}
    M190 S{bed}
    M109 S{extr}
    M117 Re-home Z a quente
    G90
    G0 Z15 F600
    G28 Z
    BED_MESH_PROFILE LOAD=default
    # 2026-09-02 -- ORDEM CORRIGIDA (pedido do Igor).
    # Era: ... G28 Z -> PURGA_BAMBU -> LINHA_PURGA -> imprime.
    # LINHA_PURGA REMOVIDA daqui: ela ia para X10 Y5 Z0.4, dentro da faixa da borracha
    # (X0-5 / Y0-35, 7mm de altura) e era o ULTIMO movimento antes de imprimir -> o bico
    # mergulhava na borracha em vez de so escovar, e saia sujo/arrastando.
    # PURGA_BAMBU Q=50 ja escorva o bico de sobra (50mm de filamento), entao a linha era
    # redundante. A macro LINHA_PURGA continua existindo para uso manual.
    # Regra desta maquina: o ULTIMO contato fisico e sempre a borracha, e nao existe
    # nenhum G28 depois dele (o G28 Z acima e o ultimo homing do PRINT_START).
    # PURGA_BAMBU faz: sobe Z27 -> purga a Z7 em X0 Y45 -> retrai E-4 -> limpa na borracha
    # (4 passadas) -> sobe Z27. Ou seja: purga -> retracao -> limpeza, nessa ordem.
    PURGA_BAMBU Q=50 VOLTAR=0
    # Retracao curta de 0.2mm imediatamente antes de imprimir (anti-escorrimento).
    M83
    G1 E-0.2 F1800
    M82
    G92 E0
    M117 Printing
[gcode_macro PRINT_END]
gcode:
    SAVE_VARIABLE VARIABLE=was_interrupted VALUE=False
    RUN_SHELL_COMMAND CMD=clear_plr
    clear_last_file
    {% set RUN_VELOCITY = printer.configfile.settings['printer'].max_velocity|float %}
    {% set RUN_ACCEL    = printer.configfile.settings['printer'].max_accel|float %}
    SET_VELOCITY_LIMIT VELOCITY={RUN_VELOCITY} ACCEL={RUN_ACCEL}

    M220 S100
    M221 S100
    {% set z = params.Z|default(100)|int %}
    {% if (printer.gcode_move.position.z+5) < z %}   #If the current gcode-Z position is less than the maximum limit position
      G90 							            ; absolute positioning
      G1 Z{z+5} F6000 				      ; park nozzle at rear
    {% endif %}
    TURN_OFF_HEATERS
    M107
    M84


[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
      SAVE_VARIABLE VARIABLE=was_interrupted VALUE=False
      RUN_SHELL_COMMAND CMD=clear_plr
      clear_last_file
      {% set RUN_VELOCITY = printer.configfile.settings['printer'].max_velocity|float %}
      {% set RUN_ACCEL    = printer.configfile.settings['printer'].max_accel|float %}
      SET_VELOCITY_LIMIT VELOCITY={RUN_VELOCITY} ACCEL={RUN_ACCEL}
      {% set z = params.Z|default(100)|int %}  
      {% set x_park = params.X|default(printer.toolhead.axis_minimum.x+5)|int %} 
      {% set y_park = params.Y|default(printer.toolhead.axis_maximum.y-5)|int %} 
      SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout} 
      SDCARD_RESET_FILE
      M220 S100
      M221 S100
      M400 							            ; wait for buffer to clear
      G91 							            ; relative positioning
      M83 							          ; zero the extruder
      G1 E-10.0 F1200 				      ; retract filament
      TURN_OFF_HEATERS
      M107 							            ; turn off fan
      {% if (printer.gcode_move.position.z+5) < z %}
      G90 
      G0 X{x_park} Y{y_park} Z{z+5} F6000 
      {% endif %}
      {%if (printer.gcode_move.position.z+5) >= z %}
      {%if (printer.gcode_move.position.z+5) < printer.toolhead.axis_maximum.z %}
      G91 							            ; relative positioning
      G1 Z5 F300
      G90
      G0 X{x_park} Y{y_park} F6000 				      ; park nozzle at rear
      {% else %}
      G90
      G0 X{x_park} Y{y_park} Z{printer.toolhead.axis_maximum.z} F6000 				      ; park nozzle at rear
      {% endif %}
      {% endif %}
      M84

[pause_resume]
recover_velocity: 50.0 

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    M400 
    {% set z = params.Z|default(30)|int %}                                                   
    {% set E = (params.E|default(2))|float %}
    {% set x_park = params.X|default(printer.toolhead.axis_minimum.x+5)|int %} 
    {% set y_park = params.Y|default(printer.toolhead.axis_maximum.y / 2)|int %} 
                                                                                  
    {% if (printer.gcode_move.position.x) <= (x_park+1) %}
      M400
    {% else %}
      {% set position = printer.gcode_move.gcode_position %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=saved_x VALUE="{position.x}"
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=saved_y VALUE="{position.y}"
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=saved_z VALUE="{position.z}"
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=saved_e VALUE="{position.e}"
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer['extruder'].target}   
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=bed_temp VALUE={printer['heater_bed'].target}   
        SAVE_GCODE_STATE NAME=timelapse_state_a
        M83
        G91
      {% if (printer.gcode_move.position.z+5) <  printer.toolhead.axis_maximum.z  %} 
        G1 E-2 X3 Z1 F2100
        G1 Z4 F600
      {% endif %}
        SAVE_GCODE_STATE NAME=timelapse_state_b
        G90
      {% if (printer.gcode_move.position.z+5) < z %}
        G1 Z{z+5} X{x_park} Y{y_park} E-20 F6000 
      {% else %}
        G1 X{x_park} Y{y_park} E-20 F6000
      {% endif %}
        M400
        M25
        SET_IDLE_TIMEOUT TIMEOUT=1200
        M400
    {% endif %}
                                                           


[gcode_macro RESUME]
rename_existing: BASE_RESUME
variable_zhop: 0
variable_etemp: 0
variable_bed_temp: 0
variable_saved_x: 0.0
variable_saved_y: 0.0
variable_saved_z: 0.0
variable_saved_e: 0.0
gcode:
    M24
    {% set e = params.E|default(2)|int %}   
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
    {% if printer[printer.toolhead.extruder].temperature < etemp-4 %}   
      SET_HEATER_TEMPERATURE HEATER=extruder TARGET={etemp}   
      SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={bed_temp}
      TEMPERATURE_WAIT SENSOR=extruder MINIMUM={etemp-4} MAXIMUM={etemp+10}   
    {% endif %} 
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={etemp}   
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={bed_temp}
    M17 E
    # 2026-08-29: antes era G1 E100 F200 na posicao em que a peca estava parada,
    # ou seja, 100mm de filamento largados em cima da impressao, com uma sacudida
    # em X para tentar limpar. Agora a purga vai para o canto morto e o bico e
    # limpado na borracha antes de voltar para a peca.
    PURGA_BAMBU Q=100
    G90
    G92 E{saved_e}
    RESTORE_GCODE_STATE NAME=timelapse_state_b MOVE=1 MOVE_SPEED=250
    RESTORE_GCODE_STATE NAME=timelapse_state_a MOVE=1 MOVE_SPEED=250 
    SAVE_GCODE_STATE NAME=timelapse_state_a
    SAVE_GCODE_STATE NAME=timelapse_state_b
    M400
    ;M24

[filament_switch_sensor fila]
pause_on_runout: True
runout_gcode:
    SET_FILAMENT_SENSOR SENSOR=fila ENABLE=1
    M118 ;Filament detection is triggered,please check.
insert_gcode:
event_delay: 3.0
pause_delay: 1.0
switch_pin: PA12

##############################################################

[gcode_macro M104]
rename_existing: M99104
gcode:
  {% if 'S' in params %}
    {% if (params.S|float) > 300 %}
      M118 ;The nozzle setting temperature is out of limit and has been automatically adjusted to Limit the temperature.
      M118 ;热端设置温度超限，已经自动调整至限制温度。
    {% endif %}
    {% set TARGET = (params.S|float, 300)|min %}
    SET_HEATER_TEMPERATURE HEATER=extruder  TARGET={TARGET|int} 
  {% endif %}


[gcode_macro M109]
rename_existing: M99109
gcode:
  {% if 'S' in params %}
    {% if (params.S|float) > 300 %}
      M118 ;The nozzle setting temperature is out of limit and has been automatically adjusted to Limit the temperature.
      M118 ;热端设置温度超限，已经自动调整至限制温度。
    {% endif %}
    {% set TARGET = (params.S|float, 300)|min %}
    SET_HEATER_TEMPERATURE HEATER=extruder  TARGET={TARGET|int}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={TARGET - 4} MAXIMUM={TARGET + 35}   
  {% endif %}


[gcode_macro M140]
rename_existing: M99140
gcode:
  {% if 'S' in params %}
    {% if (params.S|float) > 100 %}
      M118 ;The hot bed setting temperature is out of limit and has been automatically adjusted to Limit the temperature.
      M118 ;热床设置温度超限，已经自动调整至限制温度。
    {% endif %}
    {% set TARGET = (params.S|float, 100)|min %}
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={TARGET|int}
  {% endif %}


[gcode_macro M190]
rename_existing: M99190
gcode:
  {% if 'S' in params %}
    {% if (params.S|float) > 100 %}
      M118 ;The hot bed setting temperature is out of limit and has been automatically adjusted to Limit the temperature.
      M118 ;热床设置温度超限，已经自动调整至限制温度。
    {% endif %}
    {% set TARGET = (params.S|float, 100)|min %}
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={TARGET|int}
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={TARGET - 2} MAXIMUM={TARGET + 35}   
  {% endif %}


[display_status]


[gcode_macro M17]
gcode:
  {% if 'X' in params or 'Y' in params or 'Z' in params or 'E' in params %}
  {% if 'X' in params %}
      SET_STEPPER_ENABLE STEPPER=stepper_x enable=1
  {% endif %}
  {% if 'Y' in params %}
      SET_STEPPER_ENABLE STEPPER=stepper_y enable=1
  {% endif %}
  {% if 'Z' in params %}
      SET_STEPPER_ENABLE STEPPER=stepper_z enable=1
  {% endif %}
  {% if 'E' in params %}
      SET_STEPPER_ENABLE STEPPER=extruder enable=1
  {% endif %}
  {% else %}
      SET_STEPPER_ENABLE STEPPER=stepper_x enable=1
      SET_STEPPER_ENABLE STEPPER=stepper_y enable=1
      SET_STEPPER_ENABLE STEPPER=stepper_z enable=1
      #SET_STEPPER_ENABLE STEPPER=extruder enable=1
  {% endif %}



[gcode_macro M84]
rename_existing:M84.1
gcode:

  {% if 'X' in params or 'Y' in params or 'Z' in params or 'E' in params %}
  {% if 'X' in params %}
      SET_STEPPER_ENABLE STEPPER=stepper_x enable=0
  {% endif %}
  {% if 'Y' in params %}
      SET_STEPPER_ENABLE STEPPER=stepper_y enable=0
