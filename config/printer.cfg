####################################################################
## G-code macro definition
#####################################################################

[gcode_macro m600]
description: Pausa e recua o filamento para a troca
# 2026-08-29: alem de pausar, desenrosca o filamento para voce puxar na mao.
# Depois de por o novo, rode RESUME: ele purga no canto, limpa o bico na borracha
# e volta para a peca. Nao faz linha de purga na volta, so no inicio da impressao.
gcode:
  M400
  PAUSE
  M400
  {% if printer.extruder.temperature < 170 %}
    RESPOND TYPE=error MSG="Bico frio: aqueca antes de recuar o filamento."
  {% else %}
    M83
    G1 E-80 F300
    RESPOND TYPE=command MSG="Filamento recuado. Coloque o novo e rode RESUME."
  {% endif %}

[gcode_macro M106]
rename_existing: M99106
gcode:
    {% if 'S' in params %}
    {% set s = (params.S|float, 255)|min %}
      {% if (printer.toolhead.fan_mode) == 0 %}
        MKS_M106 S={(204, s)|min}
      {% endif %}
      {% if (printer.toolhead.fan_mode) == 1 %}
        MKS_M106 S={(153, s)|min}
      {% endif %}
      {% if (printer.toolhead.fan_mode) == 2 %}
        MKS_M106 S={s}
      {% endif %}
    {% endif %}

################ Buzzer configuration ##################
[output_pin beeper]
pin: PA2
pwm: true
shutdown_value:0
value:0.0


[gcode_macro m300]
description: Emits and audible beep.
  Usage: M300 [P<duration>] [S<frequency>]
gcode:
  {% set settings = printer.configfile.settings %}
  {% if "output_pin beeper" in printer %}
    {% set P = (params.P|default(100)|int, 0)|max %}
    {% set S = (params.S|default(1000)|int, 10000)|min %}
    SET_PIN PIN=beeper VALUE={
        settings["output_pin beeper"].scale|default(1.0) * 0.5
      }{% if settings["output_pin beeper"].pwm %} CYCLE_TIME={
        1.0 / S }{% endif %}
    G4 P{P}
    SET_PIN PIN=beeper VALUE=0
  {% else %}
    {action_respond_info(
       "M300 is disabled. To enable create an [output_pin beeper] config.")}
  {% endif %}
  
[gcode_arcs]
resolution: 0.1

[exclude_object]


[gcode_macro CALIBRAR_TUDO]
description: Roda todas as calibracoes automaticas (menos Z-offset). Params: BED, NOZZLE, PID=0/1
gcode:
    {% set bed    = params.BED|default(60)|float %}
    {% set nozzle = params.NOZZLE|default(150)|float %}
    {% set pid    = params.PID|default(1)|int %}
    {% set pid_bed    = params.PID_BED|default(70)|float %}
    {% set pid_nozzle = params.PID_NOZZLE|default(240)|float %}

    {% if printer.print_stats.state in ['printing','paused'] %}
        { action_raise_error("Impressora ocupada. Cancele a impressao antes de calibrar.") }
    {% endif %}

    RESPOND MSG="=== CALIBRACAO COMPLETA - leva de 20 a 40 min ==="
    RESPOND MSG="NAO desligue. SAVE_CONFIG no final grava malha/PID/shaper; esta rotina nao altera o z_offset."

    # ---------- 1. Aquecimento ----------
    RESPOND MSG="[1/5] Aquecendo: mesa {bed}C, bico {nozzle}C (bico morno, nao escorre)"
    M140 S{bed}
    M104 S{nozzle}
    M190 S{bed}
    M109 S{nozzle}
    G4 P30000                      ; soak 30s para a mesa estabilizar

    # ---------- 2. Home ----------
    RESPOND MSG="[2/5] Referenciando eixos"
    G28
    M400

    # ---------- 3. Repetibilidade da sonda ----------
    RESPOND MSG="[3/5] Testando repetibilidade da sonda (diagnostico)"
    PROBE_ACCURACY SAMPLES=10
    M400

    # ---------- 4. Malha da mesa ----------
    RESPOND MSG="[4/5] Mapeando a mesa"
    # sonda com offset zerado e devolve depois, para nao contaminar a malha
    {% set off = printer.gcode_move.homing_origin.z %}
    SET_GCODE_OFFSET Z=0
    BED_MESH_CLEAR
    _BED_MESH_CALIBRATE PROFILE=default
    M400
    SET_GCODE_OFFSET Z={off}

    # ---------- 5. Input shaper ----------
    RESPOND MSG="[5/5] Medindo ressonancia (vai sacudir os eixos, e normal)"
    # um eixo por vez: os dois seguidos estouram o SPI desta CPU
    # (erro: Unable to obtain spi_transfer_response)
    RESPOND MSG="   eixo X..."
    SHAPER_CALIBRATE AXIS=X
    M400
    G4 P5000
    RESPOND MSG="   eixo Y..."
    SHAPER_CALIBRATE AXIS=Y
    M400

    # ---------- 6. PID (opcional) ----------
    {% if pid == 1 %}
        RESPOND MSG="[extra] PID da mesa em {pid_bed}C"
        PID_CALIBRATE HEATER=heater_bed TARGET={pid_bed}
        M400
        RESPOND MSG="[extra] PID do bico em {pid_nozzle}C"
        PID_CALIBRATE HEATER=extruder TARGET={pid_nozzle}
        M400
    {% endif %}

    TURN_OFF_HEATERS
    M107
    RESPOND MSG="=== FIM ==="
    RESPOND MSG="SAVE_CONFIG grava malha/PID/shaper; o z_offset nao foi alterado por esta rotina."
    RESPOND MSG="Z-offset nao foi tocado, como pedido."


[gcode_macro CALIBRAR_RAPIDO]
description: So malha da mesa + input shaper. Sem PID, ~10 min
gcode:
    CALIBRAR_TUDO PID=0

# ---------------------------------------------------------------
# Compensacao de Z aplicada a cada home.
# Motivo: nesta maquina o [probe] z_offset NAO desloca o sistema de
# coordenadas (comportamento anormal, causa nao identificada em
# 2026-07-27). O valor abaixo foi medido com papel: ponto de contato
# fica 2.0mm abaixo do que o Klipper chama de Z=0.
# Se trocar bico, sonda ou mesa, este valor precisa ser refeito.
# Para desativar: comente o bloco inteiro e reinicie.
# ---------------------------------------------------------------
# DESATIVADO 2026-08-29: este -1.95 foi medido em 2026-07-27 para a sonda FISICA
# (pin PA11). A sonda foi trocada pelo Eddy em 2026-08-28 e a compensacao continuou
# sendo aplicada cega, somando com o z_offset do Eddy -> todo G0 Z descia 1.95mm a
# mais que o comandado. Foi a causa do bico arrastar na chapa em 2026-08-29.
# So reativar depois de remedir com papel, se o Eddy realmente nao deslocar o sistema.
#[gcode_macro G28]
#rename_existing: G28.1
#gcode:
#    G28.1 {rawparams}
#    SET_GCODE_OFFSET Z=-1.95
#    RESPOND MSG="Z compensado em -1.95(ver comentario no printer.cfg)"


# ---------------------------------------------------------------------------
# MANTER_MESA_50 -- mesa sempre a 50C quando ociosa (pedido do Igor 2026-08-29)
# Motivo: a mesa desta maquina demora muito para aquecer; manter em 50 economiza
# o tempo de preaquecimento. Re-arma sozinha a cada 60s.
# Nao mexe se estiver imprimindo/pausada, e nao rebaixa alvo maior que 50
# (ex.: print de PETG a 80 segue em 80).
# Para desligar: comente o bloco inteiro e reinicie.
# ---------------------------------------------------------------------------
[delayed_gcode MANTER_MESA_50]
initial_duration: 15
gcode:
    {% if printer.print_stats.state not in ["printing", "paused"] and printer.heater_bed.target < 50 %}
        M140 S50
    {% endif %}
    UPDATE_DELAYED_GCODE ID=MANTER_MESA_50 DURATION=60


# ---------------------------------------------------------------------------
# LINHA_PURGA -- substitui o LINE_PURGE do KAMP (que nao existe: include desativado).
# Linha dupla em Y=8, de X20 a X200 -- longe da borracha de limpeza (X0-5 / Y0-35).
# ---------------------------------------------------------------------------
[gcode_macro LINHA_PURGA]
description: Pequena linha de purga traseira, apos a limpeza na borracha
variable_x: 10
variable_y_ini: 5
variable_y_fim: 28
variable_altura: 0.4
variable_e: 8
gcode:
    {% set c = printer['gcode_macro LINHA_PURGA'] %}
    M117 Linha de purga
    G90
    G0 Z7 F1200
    G0 X{c.x} Y{c.y_ini} F6000
    G0 Z{c.altura} F600
    G92 E0
    M83
    G1 Y{c.y_fim} E{c.e} F1200
    G1 E-1.0 F2100
    G92 E0
    M82
    G0 Z2 F600
[gcode_macro SOBE]
description: Afasta o bico da mesa. Ex: SOBE P=0.05 (padrao 0.02)
gcode:
    {% set p = params.P|default(0.02)|float %}
    {% set m = 1 if 'z' in printer.toolhead.homed_axes else 0 %}
    SET_GCODE_OFFSET Z_ADJUST={p} MOVE={m}
    RESPOND TYPE=command MSG="Bico afastado {p}mm. Ajuste da sessao: {'%+.3f' % (printer.gcode_move.homing_origin.z + p)}mm. Gravar com ZOFFSET_SALVAR"

[gcode_macro DESCE]
description: Aproxima o bico da mesa. Ex: DESCE P=0.05 (padrao 0.02)
gcode:
    {% set p = params.P|default(0.02)|float %}
    {% set m = 1 if 'z' in printer.toolhead.homed_axes else 0 %}
    SET_GCODE_OFFSET Z_ADJUST=-{p} MOVE={m}
    RESPOND TYPE=command MSG="Bico aproximado {p}mm. Ajuste da sessao: {'%+.3f' % (printer.gcode_move.homing_origin.z - p)}mm. Gravar com ZOFFSET_SALVAR"

[gcode_macro ZOFFSET]
description: Mostra o z_offset gravado e o ajuste da sessao
gcode:
    {% set s = printer.gcode_move.homing_origin.z %}
    # guarda de z_offset do driver antigo removida na migracao p/ eddy-ng
    {% if 'z' not in printer.toolhead.homed_axes %}
        { action_raise_error("ZOFFSET_EDITAR: faca o home Z antes de gravar") }
    {% endif %}
    SET_GCODE_OFFSET Z_ADJUST={atual - novo} MOVE=0
    RESPOND TYPE=command MSG="Gravando z_offset { '%.3f' % novo }mm (atual: { '%.3f' % atual }mm)."
    Z_OFFSET_APPLY_PROBE
    SAVE_CONFIG
[gcode_macro ZOFFSET_SALVAR]
description: Grava o ajuste da sessao no z_offset e reinicia
gcode:
    {% if printer.gcode_move.homing_origin.z == 0 %}
        RESPOND TYPE=error MSG="Nada para gravar: use SOBE ou DESCE antes."
    {% else %}
        RESPOND TYPE=command MSG="Gravando {'%+.3f' % printer.gcode_move.homing_origin.z}mm no z_offset."
        Z_OFFSET_APPLY_PROBE
        SAVE_CONFIG
    {% endif %}


# ---------------------------------------------------------------------------
# PURGA_BAMBU -- purga em bloco no canto morto e limpeza na borracha (2026-08-29)
# Larga o filamento em X0 Y45, logo atras da borracha de limpeza (que vai ate Y35),
# e em seguida passa o bico na borracha para tirar o rabo. E o que a Bambu faz com
# a torre de coco mais o limpador de silicone, adaptado para esta mesa.
# Quantidade em mm de filamento: PURGA_BAMBU Q=30
# Nao aquece nada: usa a temperatura em que o bico ja esta.
# ---------------------------------------------------------------------------
[gcode_macro PURGA_BAMBU]
description: Purga junto a borracha, limpa o bico e sobe em seguranca. Ex: PURGA_BAMBU Q=30
variable_x: 0
variable_y: 45
variable_z: 7
variable_quantidade: 50
variable_velocidade: 150
variable_altura_segura: 27
gcode:
    {% set c = printer['gcode_macro PURGA_BAMBU'] %}
    {% set q = params.Q|default(c.quantidade)|float %}
    {% set voltar = params.VOLTAR|default(1)|int %}
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        { action_raise_error("PURGA_BAMBU: eixos nao homeados") }
    {% endif %}
    {% if printer.extruder.temperature < 170 %}
        { action_raise_error("PURGA_BAMBU: bico frio demais para extrudar") }
    {% endif %}
    SAVE_GCODE_STATE NAME=purga_bambu
    M117 Purgando na borracha
    G90
    G0 Z{c.altura_segura} F1200
    G0 X{c.x} Y{c.y} F6000
    G0 Z{c.z} F600
    M83
    G1 E{q} F{c.velocidade}
    G1 E-4 F2100
    G4 P1500
    G0 Z{c.altura_segura} F1200
    LIMPAR_BICO TEMP=0 PASSADAS=4
    # A limpeza termina a Z17; sobe mais 10 mm, totalizando 20 mm acima da borracha.
    G0 Z{c.altura_segura} F1200
    G92 E0
    RESTORE_GCODE_STATE NAME=purga_bambu MOVE={voltar} MOVE_SPEED=200
    M117
[gcode_macro EDDY_OFFSET_FULL]
description: Homeia, limpa o bico e abre o ajuste de z-offset
variable_temp_limpeza: 200
variable_temp_offset: 150
variable_passadas: 20
variable_bed: 50
variable_soak: 0
gcode:
    {% set c = printer['gcode_macro EDDY_OFFSET_FULL'] %}
    {% set bed = params.BED|default(c.bed)|float %}
    {% set soak = params.SOAK|default(c.soak)|int %}
    {% if printer.print_stats.state in ['printing', 'paused'] %}
        { action_raise_error("EDDY_OFFSET_FULL: impressora ocupada") }
    {% endif %}
    {% if bed < 30 or bed > 100 %}
        { action_raise_error("EDDY_OFFSET_FULL: BED deve estar entre 30 e 100C") }
    {% endif %}
    {% if soak < 0 or soak > 3600 %}
        { action_raise_error("EDDY_OFFSET_FULL: SOAK deve estar entre 0 e 3600s") }
    {% endif %}
    M117 Aquecendo a mesa
    M140 S{bed}
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed - 1} MAXIMUM={bed + 1}
    M117 Estabilizando a mesa
    G4 P{soak * 1000}
    M117 Homeando
    G28
    M117 Aquecendo o bico
    M109 S{c.temp_limpeza}
    M104 S{c.temp_offset}
    M106 S255
    M117 Limpando enquanto esfria
    LIMPAR_BICO TEMP=0 PASSADAS={c.passadas}
    M117 Esperando {c.temp_offset}C
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={c.temp_offset + 2}
    M106 S0
    M117 Posicionando
    G90
    G0 Z10 F1200
    G0 X215 Y215 F6000
    G0 Z3 F600
    RESPOND TYPE=command MSG="Mesa estabilizada a {bed}C e bico limpo a {c.temp_offset}C. Com o papel: TESTZ Z=-0.1 ate raspar, ACCEPT e depois SAVE_CONFIG."
    PROBE_CALIBRATE


[gcode_macro FAKE_BEDMESH]
description: Movimento cosmetico tipo bed mesh, so para gravar video (nao mede nada, sem pausas)
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G90
    G0 Z10 F1200
    {% for y in [0, 66.7, 133.3, 200, 266.7, 333.3, 400] %}
      {% for x in ([0,44.4,88.9,133.3,177.8,222.2,266.7,311.1,355.6,400] if loop.index0 is even else [400,355.6,311.1,266.7,222.2,177.8,133.3,88.9,44.4,0]) %}
        G0 X{x} Y{y} F24000
      {% endfor %}
    {% endfor %}
    G0 Z10 F1200
    G0 X200 Y200 F24000
    M117 Nivelamento (demo) concluido
