<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>Ordem da migração para eddy-ng</title>
  <desc>Sequencia de migracao: backup, clone permanente, ambiente Python 3, servico, instalacao do eddy-ng, firmware do Eddy e troca da configuracao, com marcadores de reversivel e reinicio.</desc>
  <style>
    :root {
      --bg: #f4f5f7;
      --panel: #f7f7f2;
      --text: #242424;
      --muted: #4a4a4a;
      --accent: #d95a14;
      --soft: #ffd9bd;
      --grey: #7d7d7d;
      --danger: #b83a2e;
      --green: #2f8f4e;
    }
    .mono { font-family: "Courier New", Courier, monospace; }
  </style>

  <rect x="0" y="0" width="1080" height="520" rx="10" fill="var(--bg)"/>
  <text x="28" y="38" font-size="16" fill="var(--text)" font-weight="700">A ordem da migração para eddy-ng</text>

  <rect x="26" y="122" width="126" height="118" rx="8" fill="var(--panel)" stroke="var(--grey)" stroke-width="1.3"/>
  <circle cx="50" cy="146" r="14" fill="var(--accent)"/>
  <text x="50" y="151" font-size="13" fill="var(--panel)" font-weight="700" text-anchor="middle">0</text>
  <text x="89" y="170" font-size="12.5" fill="var(--text)" text-anchor="middle">backup e</text>
  <text x="89" y="188" font-size="12.5" fill="var(--text)" text-anchor="middle">alterações</text>
  <text x="89" y="206" font-size="12.5" fill="var(--text)" text-anchor="middle">locais salvas</text>
  <text x="89" y="228" font-size="11" fill="var(--green)" font-weight="700" text-anchor="middle">reversível</text>

  <line x1="152" y1="181" x2="180" y2="181" stroke="var(--muted)" stroke-width="2"/>
  <polygon points="190,181 172,172 172,190" fill="var(--muted)"/>

  <rect x="190" y="122" width="126" height="118" rx="8" fill="var(--panel)" stroke="var(--grey)" stroke-width="1.3"/>
  <circle cx="214" cy="146" r="14" fill="var(--accent)"/>
  <text x="214" y="151" font-size="13" fill="var(--panel)" font-weight="700" text-anchor="middle">1</text>
  <text x="253" y="170" font-size="12.5" fill="var(--text)" text-anchor="middle">clonar em</text>
  <text x="253" y="188" font-size="12.5" fill="var(--text)" text-anchor="middle">local fixo</text>
  <text x="253" y="210" font-size="11" fill="var(--danger)" class="mono" font-weight="700" text-anchor="middle">nunca /tmp</text>
  <text x="253" y="228" font-size="11" fill="var(--green)" font-weight="700" text-anchor="middle">reversível</text>

  <line x1="316" y1="181" x2="344" y2="181" stroke="var(--muted)" stroke-width="2"/>
  <polygon points="354,181 336,172 336,190" fill="var(--muted)"/>

  <rect x="354" y="122" width="126" height="118" rx="8" fill="var(--panel)" stroke="var(--grey)" stroke-width="1.3"/>
  <circle cx="378" cy="146" r="14" fill="var(--accent)"/>
  <text x="378" y="151" font-size="13" fill="var(--panel)" font-weight="700" text-anchor="middle">2</text>
  <text x="417" y="169" font-size="12.5" fill="var(--text)" text-anchor="middle">Python 3 novo</text>
  <text x="417" y="187" font-size="12.5" fill="var(--text)" text-anchor="middle">ao lado do</text>
  <text x="417" y="205" font-size="12.5" fill="var(--text)" text-anchor="middle">antigo</text>
  <text x="417" y="228" font-size="11" fill="var(--green)" font-weight="700" text-anchor="middle">reversível</text>

  <line x1="480" y1="181" x2="508" y2="181" stroke="var(--muted)" stroke-width="2"/>
  <polygon points="518,181 500,172 500,190" fill="var(--muted)"/>

  <rect x="518" y="122" width="126" height="118" rx="8" fill="var(--panel)" stroke="var(--grey)" stroke-width="1.3"/>
  <circle cx="542" cy="146" r="14" fill="var(--accent)"/>
  <text x="542" y="151" font-size="13" fill="var(--panel)" font-weight="700" text-anchor="middle">3</text>
  <text x="581" y="166" font-size="12.5" fill="var(--text)" text-anchor="middle">apontar o</text>
  <text x="581" y="184" font-size="12.5" fill="var(--text)" text-anchor="middle">serviço e</text>
  <text x="581" y="202" font-size="12.5" fill="var(--text)" text-anchor="middle">reiniciar</text>
  <text x="581" y="228" font-size="11" fill="var(--danger)" font-weight="700" text-anchor="middle">reinicia Klipper</text>

  <line x1="644" y1="181" x2="672" y2="181" stroke="var(--muted)" stroke-width="2"/>
  <polygon points="682,181 664,172 664,190" fill="var(--muted)"/>

  <rect x="682" y="122" width="144" height="118" rx="8" fill="var(--panel)" stroke="var(--grey)" stroke-width="1.3"/>
  <circle cx="706" cy="146" r="14" fill="var(--accent)"/>
  <text x="706" y="151" font-size="13" fill="var(--panel)" font-weight="700" text-anchor="middle">4</text>
  <text x="754" y="166" font-size="12.5" fill="var(--text)" text-anchor="middle">instalar e</text>
  <text x="754" y="184" font-size="12.5" fill="var(--text)" text-anchor="middle">conferir os</text>
  <text x="754" y="202" font-size="12.5" fill="var(--text)" text-anchor="middle">dois patches</text>
  <text x="754" y="228" font-size="11" fill="var(--green)" font-weight="700" text-anchor="middle">reversível</text>

  <line x1="826" y1="181" x2="854" y2="181" stroke="var(--muted)" stroke-width="2"/>
  <polygon points="864,181 846,172 846,190" fill="var(--muted)"/>

  <rect x="864" y="122" width="126" height="118" rx="8" fill="var(--panel)" stroke="var(--grey)" stroke-width="1.3"/>
  <circle cx="888" cy="146" r="14" fill="var(--accent)"/>
  <text x="888" y="151" font-size="13" fill="var(--panel)" font-weight="700" text-anchor="middle">5</text>
  <text x="927" y="166" font-size="12.5" fill="var(--text)" text-anchor="middle">recompilar e</text>
  <text x="927" y="184" font-size="12.5" fill="var(--text)" text-anchor="middle">gravar o</text>
  <text x="927" y="202" font-size="12.5" fill="var(--text)" text-anchor="middle">firmware Eddy</text>
  <text x="927" y="228" font-size="11" fill="var(--danger)" font-weight="700" text-anchor="middle">para o serviço</text>

  <path d="M927 240 L927 292 L581 292 L581 326" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="581,336 572,318 590,318" fill="var(--muted)"/>

  <rect x="432" y="336" width="298" height="82" rx="8" fill="var(--panel)" stroke="var(--grey)" stroke-width="1.3"/>
  <circle cx="456" cy="360" r="14" fill="var(--accent)"/>
  <text x="456" y="365" font-size="13" fill="var(--panel)" font-weight="700" text-anchor="middle">6</text>
  <text x="581" y="368" font-size="13" fill="var(--text)" text-anchor="middle">trocar a configuração</text>
  <text x="581" y="389" font-size="12" fill="var(--muted)" class="mono" text-anchor="middle">probe_eddy_current -> probe_eddy_ng</text>
  <text x="581" y="410" font-size="11" fill="var(--green)" font-weight="700" text-anchor="middle">volta restaurando os backups</text>

  <rect x="98" y="440" width="884" height="42" rx="8" fill="var(--soft)" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="540" y="466" font-size="12.5" fill="var(--accent)" font-weight="700" text-anchor="middle">A migração troca software e firmware do Eddy. A placa-mãe da impressora não é regravada.</text>
</svg>
