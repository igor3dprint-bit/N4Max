<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" font-family="Helvetica, Arial, sans-serif">
  <style>
    :root {
      --bg: #f4f5f7;
      --panel: #ffffff;
      --text: #222222;
      --muted: #444444;
      --accent: #e8590c;
      --soft: #ffdcc0;
      --grey: #8a8a8a;
      --danger: #c0392b;
      --green: #2f9e44;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161922;
        --panel: #20242f;
        --text: #e8eaee;
        --muted: #7a828f;
        --accent: #ff8b4a;
        --soft: #3a2415;
        --grey: #7a828f;
        --danger: #ff6b5e;
        --green: #63c98a;
      }
    }
    .mono { font-family: "Courier New", Courier, monospace; }
  </style>
  <rect x="0" y="0" width="860" height="430" rx="10" fill="var(--bg)"/>
  <text x="24" y="34" font-size="15" fill="var(--text)" font-weight="bold">A ordem da calibração do Eddy, que é a parte que todo mundo erra</text>

  <rect x="30" y="118" width="138" height="102" rx="8" fill="var(--panel)" stroke="var(--grey)" stroke-width="1.3"/>
  <circle cx="54" cy="142" r="14" fill="var(--accent)"/>
  <text x="54" y="147" font-size="13" fill="var(--panel)" font-weight="bold" text-anchor="middle">1</text>
  <text x="99" y="171" font-size="13" fill="var(--text)" text-anchor="middle">Config base</text>
  <text x="99" y="190" font-size="13" fill="var(--text)" text-anchor="middle">com os offsets</text>
  <text x="99" y="209" font-size="13" fill="var(--text)" text-anchor="middle">medidos</text>

  <line x1="168" y1="169" x2="202" y2="169" stroke="var(--muted)" stroke-width="2"/>
  <polygon points="212,169 194,160 194,178" fill="var(--muted)"/>

  <rect x="212" y="118" width="138" height="102" rx="8" fill="var(--panel)" stroke="var(--grey)" stroke-width="1.3"/>
  <circle cx="236" cy="142" r="14" fill="var(--accent)"/>
  <text x="236" y="147" font-size="13" fill="var(--panel)" font-weight="bold" text-anchor="middle">2</text>
  <text x="281" y="170" font-size="11.5" fill="var(--text)" class="mono" text-anchor="middle">LDC_CALIBRATE</text>
  <text x="281" y="187" font-size="11.5" fill="var(--text)" class="mono" text-anchor="middle">_DRIVE_CURRENT</text>
  <text x="281" y="210" font-size="12" fill="var(--accent)" class="mono" text-anchor="middle">SAVE_CONFIG</text>

  <line x1="350" y1="169" x2="384" y2="169" stroke="var(--muted)" stroke-width="2"/>
  <polygon points="394,169 376,160 376,178" fill="var(--muted)"/>

  <rect x="394" y="118" width="138" height="102" rx="8" fill="var(--panel)" stroke="var(--grey)" stroke-width="1.3"/>
  <circle cx="418" cy="142" r="14" fill="var(--accent)"/>
  <text x="418" y="147" font-size="13" fill="var(--panel)" font-weight="bold" text-anchor="middle">3</text>
  <text x="463" y="165" font-size="10" fill="var(--text)" class="mono" text-anchor="middle">PROBE_EDDY_CURRENT</text>
  <text x="463" y="181" font-size="10" fill="var(--text)" class="mono" text-anchor="middle">_CALIBRATE</text>
  <text x="463" y="198" font-size="12" fill="var(--muted)" text-anchor="middle">(com papel)</text>
  <text x="463" y="215" font-size="11.5" fill="var(--accent)" class="mono" text-anchor="middle">SAVE_CONFIG</text>

  <line x1="532" y1="169" x2="566" y2="169" stroke="var(--muted)" stroke-width="2"/>
  <polygon points="576,169 558,160 558,178" fill="var(--muted)"/>

  <rect x="576" y="118" width="118" height="102" rx="8" fill="var(--panel)" stroke="var(--grey)" stroke-width="1.3"/>
  <circle cx="600" cy="142" r="14" fill="var(--accent)"/>
  <text x="600" y="147" font-size="13" fill="var(--panel)" font-weight="bold" text-anchor="middle">4</text>
  <text x="635" y="171" font-size="13" fill="var(--text)" text-anchor="middle">Testar o</text>
  <text x="635" y="190" font-size="13" fill="var(--text)" text-anchor="middle">homing</text>
  <text x="635" y="211" font-size="12" fill="var(--accent)" class="mono" text-anchor="middle">(G28)</text>

  <line x1="694" y1="169" x2="728" y2="169" stroke="var(--muted)" stroke-width="2"/>
  <polygon points="738,169 720,160 720,178" fill="var(--muted)"/>

  <rect x="738" y="118" width="92" height="102" rx="8" fill="var(--panel)" stroke="var(--grey)" stroke-width="1.3"/>
  <circle cx="762" cy="142" r="14" fill="var(--accent)"/>
  <text x="762" y="147" font-size="13" fill="var(--panel)" font-weight="bold" text-anchor="middle">5</text>
  <text x="784" y="171" font-size="13" fill="var(--text)" text-anchor="middle">Só então</text>
  <text x="784" y="190" font-size="13" fill="var(--text)" text-anchor="middle">a malha</text>
  <text x="784" y="211" font-size="12" fill="var(--accent)" class="mono" text-anchor="middle">(bed_mesh)</text>

  <path d="M281 222 L281 312 L463 312 L463 232" fill="none" stroke="var(--danger)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="463,220 450,244 476,244" fill="var(--danger)"/>
  <rect x="168" y="334" width="525" height="48" rx="8" fill="var(--panel)" stroke="var(--danger)" stroke-width="1.7"/>
  <text x="430" y="354" font-size="13" fill="var(--danger)" font-weight="bold" text-anchor="middle">Mexeu no reg_drive_current, a tabela morreu.</text>
  <text x="430" y="373" font-size="13" fill="var(--danger)" font-weight="bold" text-anchor="middle">Refaça o passo 3 antes de qualquer G28</text>
</svg>
