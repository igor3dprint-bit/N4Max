<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" font-family="Helvetica, Arial, sans-serif">
  <style>
    :root {
      --bg: #f4f5f7;
      --panel: #ffffff;
      --text: #222222;
      --muted: #444444;
      --accent: #e8590c;
      --soft: #ffdcc0;
      --grey: #8a8a8a;
      --danger: #c0392b;
      --green: #2c5c3c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161922;
        --panel: #20242f;
        --text: #e8eaee;
        --muted: #7a828f;
        --accent: #ff8b4a;
        --soft: #3a2415;
        --grey: #7a828f;
        --danger: #ff6b5e;
        --green: #63c98a;
      }
    }
    .mono { font-family: "Courier New", Courier, monospace; }
  </style>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--muted)"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--accent)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="860" height="500" rx="10" fill="var(--bg)"/>
  <text x="24" y="34" font-size="15" fill="var(--text)" font-weight="bold">Sequência para o Eddy Duo entrar em modo de gravação</text>

  <!-- Step panels -->
  <rect x="34" y="70" width="244" height="286" rx="8" fill="var(--panel)" stroke="var(--grey)" stroke-width="1.3"/>
  <rect x="308" y="70" width="244" height="286" rx="8" fill="var(--panel)" stroke="var(--grey)" stroke-width="1.3"/>
  <rect x="582" y="70" width="244" height="286" rx="8" fill="var(--panel)" stroke="var(--grey)" stroke-width="1.3"/>

  <circle cx="58" cy="96" r="12" fill="var(--green)"/>
  <text x="58" y="100" font-size="12" fill="var(--panel)" font-weight="bold" text-anchor="middle">1</text>
  <circle cx="332" cy="96" r="12" fill="var(--green)"/>
  <text x="332" y="100" font-size="12" fill="var(--panel)" font-weight="bold" text-anchor="middle">2</text>
  <circle cx="606" cy="96" r="12" fill="var(--green)"/>
  <text x="606" y="100" font-size="12" fill="var(--panel)" font-weight="bold" text-anchor="middle">3</text>

  <!-- Step 1: hold boot with USB disconnected -->
  <path d="M132 122 L196 122 L214 138 L214 230 L196 246 L132 246 L114 230 L114 138 Z" fill="#f9fbf9" stroke="var(--green)" stroke-width="1.6"/>
  <circle cx="164" cy="132" r="12" fill="var(--accent)" stroke="var(--muted)" stroke-width="1.2"/>
  <text x="164" y="111" font-size="12" fill="var(--accent)" font-weight="bold" text-anchor="middle">BOOT</text>
  <path d="M164 112 L164 121" fill="none" stroke="var(--accent)" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <rect x="209" y="172" width="14" height="34" rx="3" fill="#dfe3e6" stroke="var(--muted)" stroke-width="1.2"/>
  <text x="236" y="193" font-size="12" fill="var(--muted)" text-anchor="middle">USB</text>
  <line x1="236" y1="172" x2="258" y2="150" stroke="var(--danger)" stroke-width="2"/>
  <line x1="258" y1="172" x2="236" y2="150" stroke="var(--danger)" stroke-width="2"/>
  <path d="M164 62 C142 70 137 92 151 115" fill="none" stroke="var(--muted)" stroke-width="2"/>
  <circle cx="164" cy="84" r="12" fill="#f4f5f7" stroke="var(--muted)" stroke-width="1.3"/>
  <path d="M164 96 L164 123" fill="none" stroke="var(--muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="156" y="292" font-size="13" fill="var(--text)" text-anchor="middle">USB desconectado, segure</text>
  <text x="156" y="312" font-size="13" fill="var(--text)" text-anchor="middle">o BOTAO de BOOT</text>

  <!-- Step 2: plug USB while still holding -->
  <path d="M406 122 L470 122 L488 138 L488 230 L470 246 L406 246 L388 230 L388 138 Z" fill="#f9fbf9" stroke="var(--green)" stroke-width="1.6"/>
  <circle cx="438" cy="132" r="12" fill="var(--accent)" stroke="var(--muted)" stroke-width="1.2"/>
  <text x="438" y="111" font-size="12" fill="var(--accent)" font-weight="bold" text-anchor="middle">BOOT</text>
  <rect x="483" y="172" width="14" height="34" rx="3" fill="#dfe3e6" stroke="var(--muted)" stroke-width="1.2"/>
  <line x1="438" y1="96" x2="438" y2="123" stroke="var(--accent)" stroke-width="2.2" marker-end="url(#arrow-accent)"/>
  <path d="M548 189 L500 189" fill="none" stroke="var(--muted)" stroke-width="4" stroke-linecap="round"/>
  <rect x="548" y="178" width="28" height="22" rx="4" fill="#f4f5f7" stroke="var(--muted)" stroke-width="1.4"/>
  <line x1="525" y1="160" x2="501" y2="183" stroke="var(--accent)" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="430" y="292" font-size="13" fill="var(--text)" text-anchor="middle">Sem soltar, ligue o USB</text>
  <text x="430" y="315" font-size="12" fill="var(--muted)" text-anchor="middle">botao ainda pressionado</text>

  <!-- Step 3: release, board enumerates -->
  <path d="M680 122 L744 122 L762 138 L762 230 L744 246 L680 246 L662 230 L662 138 Z" fill="#f9fbf9" stroke="var(--green)" stroke-width="1.6"/>
  <circle cx="712" cy="132" r="12" fill="#ffffff" stroke="var(--accent)" stroke-width="1.6"/>
  <text x="712" y="111" font-size="12" fill="var(--accent)" font-weight="bold" text-anchor="middle">BOOT</text>
  <rect x="757" y="172" width="14" height="34" rx="3" fill="#dfe3e6" stroke="var(--muted)" stroke-width="1.2"/>
  <path d="M822 189 L774 189" fill="none" stroke="var(--muted)" stroke-width="4" stroke-linecap="round"/>
  <rect x="822" y="178" width="28" height="22" rx="4" fill="#f4f5f7" stroke="var(--muted)" stroke-width="1.4"/>
  <line x1="712" y1="88" x2="712" y2="119" stroke="var(--green)" stroke-width="2" stroke-dasharray="5,5"/>
  <polygon points="712,75 704,91 720,91" fill="var(--green)"/>
  <rect x="610" y="168" width="36" height="48" rx="4" fill="#f4f5f7" stroke="var(--muted)" stroke-width="1.3"/>
  <rect x="616" y="174" width="24" height="25" rx="2" fill="var(--panel)" stroke="var(--grey)" stroke-width="1"/>
  <circle cx="628" cy="207" r="3" fill="var(--green)"/>
  <line x1="647" y1="192" x2="659" y2="192" stroke="var(--green)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="704" y="292" font-size="13" fill="var(--text)" text-anchor="middle">Solte o botao. Agora ele</text>
  <text x="704" y="312" font-size="13" fill="var(--text)" text-anchor="middle">aparece no computador</text>

  <!-- Flow arrows -->
  <line x1="278" y1="205" x2="307" y2="205" stroke="var(--muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="552" y1="205" x2="581" y2="205" stroke="var(--muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Wrong-order warning -->
  <rect x="76" y="388" width="708" height="72" rx="8" fill="var(--panel)" stroke="var(--danger)" stroke-width="1.5"/>
  <text x="102" y="427" font-size="26" fill="var(--danger)" font-weight="bold">X</text>
  <path d="M158 407 L202 407 L214 419 L214 445 L202 457 L158 457 L146 445 L146 419 Z" fill="#f9fbf9" stroke="var(--grey)" stroke-width="1.2"/>
  <circle cx="180" cy="414" r="7" fill="#ffffff" stroke="var(--grey)" stroke-width="1.1"/>
  <rect x="211" y="426" width="10" height="20" rx="2" fill="#dfe3e6" stroke="var(--muted)" stroke-width="1"/>
  <path d="M252 436 L223 436" fill="none" stroke="var(--muted)" stroke-width="3" stroke-linecap="round"/>
  <line x1="170" y1="397" x2="196" y2="423" stroke="var(--danger)" stroke-width="2.4"/>
  <line x1="196" y1="397" x2="170" y2="423" stroke="var(--danger)" stroke-width="2.4"/>
  <text x="296" y="420" font-size="14" fill="var(--danger)" font-weight="bold">USB primeiro, botao depois: nao funciona</text>
  <text x="296" y="442" font-size="13" fill="var(--muted)">O Eddy Duo precisa ver o BOOT pressionado no momento em que recebe energia pelo USB.</text>
</svg>
