<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="Helvetica, Arial, sans-serif">
  <style>
    :root {
      --bg: #f4f5f7;
      --panel: #ffffff;
      --text: #222222;
      --muted: #444444;
      --accent: #e8590c;
      --soft: #ffdcc0;
      --grey: #8a8a8a;
      --danger: #c0392b;
      --green: #2f9e44;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161922;
        --panel: #20242f;
        --text: #e8eaee;
        --muted: #7a828f;
        --accent: #ff8b4a;
        --soft: #3a2415;
        --grey: #7a828f;
        --danger: #ff6b5e;
        --green: #63c98a;
      }
    }
    .mono { font-family: "Courier New", Courier, monospace; }
  </style>
  <rect x="0" y="0" width="860" height="470" rx="10" fill="var(--bg)"/>
  <text x="24" y="34" font-size="15" fill="var(--text)" font-weight="bold">O ciclo sem sonda de contato, e como quebrá-lo</text>

  <text x="218" y="86" font-size="15" fill="var(--danger)" font-weight="bold" text-anchor="middle">Impasse</text>

  <rect x="64" y="126" width="308" height="72" rx="8" fill="var(--panel)" stroke="var(--danger)" stroke-width="1.6"/>
  <text x="218" y="156" font-size="14" fill="var(--text)" text-anchor="middle">Para homear, o bico precisa estar</text>
  <text x="218" y="176" font-size="14" fill="var(--text)" text-anchor="middle">a menos de 4 mm</text>

  <rect x="64" y="282" width="308" height="72" rx="8" fill="var(--panel)" stroke="var(--danger)" stroke-width="1.6"/>
  <text x="218" y="312" font-size="14" fill="var(--text)" text-anchor="middle">Para saber que está a menos de 4 mm,</text>
  <text x="218" y="332" font-size="14" fill="var(--text)" text-anchor="middle">o Z precisa estar homeado</text>

  <path d="M372 162 C424 188 424 292 372 318" fill="none" stroke="var(--danger)" stroke-width="3" stroke-linecap="round"/>
  <polygon points="362,323 386,323 374,303" fill="var(--danger)"/>
  <path d="M64 318 C12 292 12 188 64 162" fill="none" stroke="var(--danger)" stroke-width="3" stroke-linecap="round"/>
  <polygon points="74,157 50,157 62,177" fill="var(--danger)"/>

  <line x1="430" y1="72" x2="430" y2="422" stroke="var(--grey)" stroke-width="1.4" stroke-dasharray="5,6"/>

  <text x="616" y="86" font-size="15" fill="var(--green)" font-weight="bold" text-anchor="middle">O ritual que quebra o ciclo</text>

  <rect x="504" y="122" width="224" height="48" rx="8" fill="var(--panel)" stroke="var(--green)" stroke-width="1.4"/>
  <circle cx="528" cy="146" r="12" fill="var(--green)"/>
  <text x="528" y="150" font-size="12" fill="var(--panel)" font-weight="bold" text-anchor="middle">1</text>
  <text x="616" y="151" font-size="14" fill="var(--text)" class="mono" text-anchor="middle">G28 X Y</text>

  <line x1="616" y1="170" x2="616" y2="196" stroke="var(--muted)" stroke-width="2"/>
  <polygon points="616,206 607,188 625,188" fill="var(--muted)"/>

  <rect x="504" y="206" width="224" height="48" rx="8" fill="var(--panel)" stroke="var(--green)" stroke-width="1.4"/>
  <circle cx="528" cy="230" r="12" fill="var(--green)"/>
  <text x="528" y="234" font-size="12" fill="var(--panel)" font-weight="bold" text-anchor="middle">2</text>
  <text x="616" y="235" font-size="14" fill="var(--text)" class="mono" text-anchor="middle">G0 X215 Y215 F6000</text>

  <line x1="616" y1="254" x2="616" y2="280" stroke="var(--muted)" stroke-width="2"/>
  <polygon points="616,290 607,272 625,272" fill="var(--muted)"/>

  <rect x="482" y="290" width="268" height="64" rx="8" fill="var(--panel)" stroke="var(--green)" stroke-width="1.4"/>
  <circle cx="506" cy="322" r="12" fill="var(--green)"/>
  <text x="506" y="326" font-size="12" fill="var(--panel)" font-weight="bold" text-anchor="middle">3</text>
  <text x="616" y="315" font-size="13" fill="var(--text)" text-anchor="middle">Descer o Z pelo painel olhando o bico,</text>
  <text x="616" y="335" font-size="13" fill="var(--text)" text-anchor="middle">até uns 2 mm</text>

  <line x1="616" y1="354" x2="616" y2="380" stroke="var(--muted)" stroke-width="2"/>
  <polygon points="616,390 607,372 625,372" fill="var(--muted)"/>

  <rect x="504" y="390" width="224" height="40" rx="8" fill="var(--panel)" stroke="var(--green)" stroke-width="1.4"/>
  <circle cx="528" cy="410" r="12" fill="var(--green)"/>
  <text x="528" y="414" font-size="12" fill="var(--panel)" font-weight="bold" text-anchor="middle">4</text>
  <text x="616" y="415" font-size="14" fill="var(--text)" class="mono" text-anchor="middle">G28 Z</text>

  <text x="616" y="454" font-size="12" fill="var(--danger)" font-weight="bold" text-anchor="middle">Nunca um G0 Z absoluto calculado de cabeça enquanto o Z não for confiável</text>
</svg>
