<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 660" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="560" height="660" rx="10" fill="#f4f5f7"/>
  <text x="20" y="28" font-size="15" fill="#222222" font-weight="bold">Vista de cima, área da malha contra o prato inteiro</text>

  <!-- plate, 420x420, drawn 1mm = 1px, origin at printer (0,0) front-left -->
  <rect x="40" y="45" width="420" height="420" fill="#ffffff" stroke="#8a8a8a" stroke-width="2"/>
  <text x="42" y="480" font-size="12" fill="#666666">X0</text>
  <text x="438" y="480" font-size="12" fill="#666666">X420</text>
  <text x="16" y="470" font-size="12" fill="#666666">Y0</text>
  <text x="16" y="53" font-size="12" fill="#666666">Y420</text>
  <text x="220" y="496" font-size="12" fill="#666666">frente da impressora</text>

  <!-- mesh area, X20-390, Y25-410 -->
  <rect x="60" y="55" width="370" height="385" fill="#ffdcc0" fill-opacity="0.6" stroke="#e8590c" stroke-width="1.5"/>
  <text x="66" y="71" font-size="12" fill="#a8460b">área da malha</text>
  <text x="66" y="86" font-size="12" fill="#a8460b">X20 a X390, Y25 a Y410</text>

  <!-- example point on the plate -->
  <circle cx="245" cy="255" r="4" fill="#666666"/>
  <text x="253" y="250" font-size="11" fill="#666666">ponto de exemplo, ampliado abaixo</text>

  <!-- callout box, not to scale, well separated below the plate -->
  <text x="40" y="540" font-size="13" fill="#222222" font-weight="bold">Detalhe do offset, fora de escala</text>

  <rect x="40" y="555" width="480" height="90" rx="8" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.3"/>

  <circle cx="110" cy="600" r="7" fill="#e8590c"/>
  <text x="100" y="583" font-size="13" fill="#e8590c" text-anchor="end">bobina</text>

  <circle cx="230" cy="622" r="7" fill="#2c5c3c"/>
  <text x="242" y="628" font-size="13" fill="#2c5c3c">bico</text>

  <line x1="110" y1="600" x2="230" y2="600" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="130" y="592" font-size="12" fill="#444444">x_offset -33,34</text>

  <line x1="230" y1="600" x2="230" y2="622" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="242" y="614" font-size="12" fill="#444444">y_offset +20</text>

  <text x="290" y="580" font-size="12" fill="#666666">A bobina fica à esquerda e</text>
  <text x="290" y="597" font-size="12" fill="#666666">atrás do bico. Por isso a malha</text>
  <text x="290" y="614" font-size="12" fill="#666666">não alcança a borda direita nem</text>
  <text x="290" y="631" font-size="12" fill="#666666">a faixa da frente do prato.</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#444444"/>
    </marker>
  </defs>
</svg>
